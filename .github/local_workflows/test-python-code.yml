name: Test python code

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - review_requested
      - ready_for_review
    paths:
      - '**/*.py'

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12' ]
        uv-version: [ '0.4.15' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ matrix.uv-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --all-extras --dev

  pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11' ]
        uv-version: [ '0.4.15' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ matrix.uv-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run pytest
        run: uv run pytest .
