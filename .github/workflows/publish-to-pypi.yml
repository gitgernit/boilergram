name: Publish to PyPi

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12' ]
        uv-version: [ '0.4.15' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ matrix.uv-version }}
      - name: Install dependencies
        run: uv sync --all-extras --no-dev

  deploy-fake:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ matrix.uv-version }}
      - name: Build
        run: uv build
      - name: Publish to Fake PyPi
        run: uv run twine upload -r testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}

  deploy:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ matrix.uv-version }}
      - name: Build
        run: uv build
      - name: Publish to PyPi
        run: uvx twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
