name: Lint python code

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - review_requested
      - ready_for_review
    paths:
      - '**/*.py'

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12' ]
        poetry-version: [ '1.8' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: ${{ matrix.poetry-version }}
      - name: Install dependencies
        run: poetry install --only linters

  ruff:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Run ruff
        run: ruff check --output-format github

  isort:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Run isort
        run: isort . --check-
